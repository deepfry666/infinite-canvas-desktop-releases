<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="四季画布 FourJ Canvas：本地优先的 AI 视觉创作画布" />
        <link rel="icon" href="/logo.svg" />
        <link rel="preload" href="/fonts/mimo/NotoSerifSC-Variable.woff2" as="font" type="font/woff2" crossorigin />
        <title>四季画布 FourJ Canvas</title>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
